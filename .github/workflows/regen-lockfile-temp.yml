name: Regenerate lockfile (temporary)

on:
  push:
    branches: [chore/android-test-deps]
    paths: ["app/build.gradle.kts", ".github/workflows/regen-lockfile-temp.yml"]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Regenerate app/gradle.lockfile
        run: ./gradlew :app:dependencies --write-locks --no-daemon

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- app/gradle.lockfile; then
            echo "lockfile already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile
          git commit -m "Regenerate app/gradle.lockfile for espresso 3.7.0 and work 2.12.0"
          git push
